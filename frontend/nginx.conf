# vite dev proxy(vite.config.ts)의 배포판 대응 — /api를 backend로, SSE 버퍼링 방지.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (§3.1): 버퍼링 끄고 장기 연결 유지
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 해시 라우팅(#/projects/...)이므로 SPA fallback은 index.html 한 줄이면 충분
    location / {
        try_files $uri /index.html;
    }
}