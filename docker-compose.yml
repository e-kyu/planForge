# M2 개발 환경 (backend/frontend/ollama 서비스는 후속 PR에서 확장)
services:
  postgres:
    image: postgres:16-alpine
    container_name: reportagent-postgres
    environment:
      POSTGRES_USER: reportagent
      POSTGRES_PASSWORD: reportagent
      # docker/postgres-init.sql이 reportagent + reportagent_test DB를 생성한다
      POSTGRES_DB: reportagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  pgdata:
  ollama-models: