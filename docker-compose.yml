# 배포 환경 (§3.1): backend + frontend + ollama. DB는 호스트 볼륨의 SQLite 파일(data/).
# ollama 사용 시 최초 1회 인증이 필요하다: docker compose --profile ollama exec ollama ollama signin
# 다른 프로바이더(openai 등)는 backend/planforge/config.json의 base_url이 LLM_BASE_URL보다 우선.
services:
  backend:
    build: ./backend
    environment:
      # SQLite 파일은 호스트 볼륨(./data)에 남는다 — 컨테이너 재생성에도 유지
      DATABASE_URL: sqlite:////srv/data/planforge.db
      # 워크스페이스/산출물은 호스트에 남긴다 (gitignore의 workspaces/·sources/와 동일 경로)
      WORKSPACES_DIR: /srv/workspaces
      GLOBAL_SOURCES_DIR: /srv/global-sources
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      PYTHONUTF8: "1"
    volumes:
      - ./workspaces:/srv/workspaces
      - ./sources:/srv/global-sources
      # SQLite DB. 바인드 마운트에서 WAL lock 이슈가 생기면 named volume으로 전환
      - ./data:/srv/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models: